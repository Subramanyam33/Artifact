Name : Artifact Upload and Download Example

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

  steps:
    -name: create a file
     run: echo "Data file" >data.txt

     -name: upload file a artifact
     uses: actions/upload-artifact@v4

  with:
    name: datafile
    path: data.txt

job2:
  runs-on: ubuntu-latest
  needs: job1

steps:
  -name: Downolad atifact file
  uses: actions/download-artifact@v4

with:
  name: datafile
  -name: show file content
  runs: cat data.txt
